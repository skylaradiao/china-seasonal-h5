 flower:{eyebrow:'中国花期地图 · 2027',title:'循着花期，<br>去中国过春天',subtitle:'拖动地图，追一场限定花事',symbol:'✿',decor:['❀','✿','❁'],tag:()=> '当季花事',place:p=>`${p.name}，等一场花开`,description:'跟着实时花期与旅行者镜头，决定这一站何时出发。',videos:p=>[`${p.name}花期实况`,'最佳拍摄机位','春日路线攻略']},
 heritage:{eyebrow:'中国非遗地图 · 长期更新',title:'循着手艺，<br>遇见活着的中国',subtitle:'拖动地图，发现身边的非遗现场',symbol:'纹',decor:['结','纹','印'],tag:()=> '活态传承',place:p=>`在${p.name}，遇见在地手艺`,description:'从技艺、节庆到日常生活，用短视频认识真实传承。',videos:p=>[`${p.name}非遗人物`,'一项技艺的诞生','跟着传承人探访']}
};
const saved=window.openai?.widgetState?.modelContent||{};
let theme=themes[saved.theme]?saved.theme:'spa';
let selected=Math.max(0,places.findIndex(p=>p.name===saved.selectedDestination));
let locale=['zh','en','ja'].includes(saved.locale)?saved.locale:'zh';
let drag={x:0,y:0,active:false,sx:0,sy:0,ox:0,oy:0};
const svg=d3.select(root).select('.china-map'); const stage=svg.select('.map-stage');
const projection=d3.geoMercator().fitExtent([[35,28],[485,395]],chinaGeo); const path=d3.geoPath(projection);
svg.select('.geo-layer').selectAll('path').data(chinaGeo.features).join('path').attr('class','geo').attr('d',path);
svg.select('.theme-photo-layer').selectAll('path').data(chinaGeo.features).join('path').attr('class','geo-photo').attr('d',path);
svg.select('.texture-layer').selectAll('path').data(chinaGeo.features).join('path').attr('class','geo-texture').attr('d',path);
const routeNames=['伊宁','林芝','腾冲','贵阳','南京汤山','长白山','阿尔山'];
const routePoints=routeNames.map(n=>places.find(p=>p.name===n)).map(p=>projection([p.lon,p.lat]));
const routePath=svg.select('.route-layer').append('path').attr('class','route').attr('d',d3.line().curve(d3.curveCatmullRom)(routePoints));
const showLabel=new Set(['长白山','腾冲','南京汤山','贵阳','阿尔山','林芝','从化']);
const marks=svg.select('.marker-layer').selectAll('g').data(places).join('g').attr('class','destination cursor-interaction').attr('transform',d=>`translate(${projection([d.lon,d.lat])})`).attr('role','button').attr('aria-label',d=>d.name).on('click',(e,d)=>{e.stopPropagation();selected=d.index-1;render()});
marks.append('circle').attr('class','hit').attr('r',22); marks.append('circle').attr('class','halo').attr('r',14); marks.append('circle').attr('class','pin').attr('r',7); marks.append('text').attr('class','symbol').attr('y',.5);
marks.filter(d=>showLabel.has(d.name)).append('text').attr('class','label').attr('x',10).attr('y',4).text(d=>d.name);

const spotlights={
 spa:[['阿尔山',-106,-49,'🌲','森林矿泉群'],['长白山',-96,-31,'❄️','雪中火山泉'],['南京汤山',16,-20,'🏯','千年古汤'],['从化',11,-1,'🌿','岭南含氡泉'],['宜春明月山',-105,12,'💧','富硒温泉'],['海螺沟',-120,-40,'🏔️','冰川脚下温泉'],['重庆北碚',-42,-59,'🌊','嘉陵江畔老汤'],['腾冲',-118,6,'🌋','火山热海']],
 flower:[['伊犁杏花沟',-94,-43,'🌸','河谷野杏花'],['林芝',-118,-40,'🌺','雪域桃花'],['昆明',-114,11,'💜','城市蓝花楹'],['毕节百里杜鹃',-67,-60,'🌷','天然杜鹃花海'],['武汉东湖',-75,-93,'🌸','湖畔樱花'],['洛阳',-61,-122,'🌹','牡丹花会'],['婺源',-31,11,'🌼','古村油菜花'],['无锡鼋头渚',12,-44,'🌸','太湖樱花']],
 heritage:[['喀什',-43,-47,'🎶','十二木卡姆'],['北京',-50,-63,'🎨','景泰蓝'],['苏州',9,-51,'🎭','昆曲'],['泉州',13,-5,'🪕','南音'],['佛山',-56,25,'🦁','广东醒狮'],['黔东南',-78,-51,'🎵','侗族大歌'],['大理周城',-110,3,'🟦','白族扎染'],['景德镇',-106,-84,'🏺','手工制瓷']]
};
const calloutLayer=svg.select('.callout-layer');
function renderCallouts(){
 svg.select('.map-photo-image').attr('href',mapThemePhoto[theme]);
 const data=spotlights[theme].map(x=>{const p=places.find(v=>v.name===x[0]);return {p,dx:x[1],dy:x[2],icon:x[3],note:x[4]}});
 routePath.attr('d',d3.line().curve(d3.curveCatmullRom)(data.map(d=>projection([d.p.lon,d.p.lat]))));
 const featuredNames=new Set(data.map(d=>d.p.name)); marks.style('display',d=>featuredNames.has(d.name)?null:'none'); marks.select('.label').style('display','none');
 const groups=calloutLayer.selectAll('g.callout').data(data,d=>d.p.name).join(enter=>{const g=enter.append('g').attr('class','callout cursor-interaction').attr('role','button');g.append('line').attr('class','callout-line');const card=g.append('g').attr('class','callout-box');card.append('rect').attr('class','callout-card').attr('width',102).attr('height',40).attr('rx',11);card.append('circle').attr('class','callout-thumb').attr('cx',18).attr('cy',20).attr('r',14);card.append('image').attr('class','callout-photo').attr('x',4).attr('y',6).attr('width',28).attr('height',28).attr('preserveAspectRatio','xMidYMid slice').attr('clip-path','url(#callout-photo-clip)');card.append('text').attr('class','callout-icon').attr('x',18).attr('y',20);card.append('text').attr('class','callout-name').attr('x',36).attr('y',16);card.append('text').attr('class','callout-note').attr('x',36).attr('y',29);return g;});
 groups.attr('transform',d=>`translate(${projection([d.p.lon,d.p.lat])})`).attr('aria-label',d=>`${d.p.name}，${d.note}`).classed('is-selected',d=>d.p.index-1===selected).on('click',(e,d)=>{e.stopPropagation();selected=d.p.index-1;render()});
 groups.select('.callout-box').attr('transform',d=>`translate(${d.dx},${d.dy})`);groups.select('.callout-line').attr('x2',d=>d.dx<0?d.dx+102:d.dx).attr('y2',d=>d.dy+20);groups.select('.callout-photo').attr('href',d=>photoManifest[d.p.name]||'');groups.select('.callout-icon').style('display','none');groups.select('.callout-name').text(d=>d.p.name);groups.select('.callout-note').text(d=>d.note);
}

function applyTransform(){stage.attr('transform',`translate(${drag.x},${drag.y})`)}
svg.on('pointerdown',e=>{if(e.target.closest('.callout,.destination'))return;drag.active=true;drag.sx=e.clientX;drag.sy=e.clientY;drag.ox=drag.x;drag.oy=drag.y;e.currentTarget.setPointerCapture(e.pointerId)}).on('pointermove',e=>{if(!drag.active)return;drag.x=drag.ox+e.clientX-drag.sx;drag.y=drag.oy+e.clientY-drag.sy;applyTransform()}).on('pointerup pointercancel',()=>{drag.active=false;save()});
root.querySelectorAll('.theme-tab').forEach(btn=>btn.addEventListener('click',()=>{theme=btn.dataset.theme;render()}));
root.querySelector('.lang-btn').addEventListener('click',()=>{locale=locale==='zh'?'en':locale==='en'?'ja':'zh';render()});
const aioDestinationUrl='https://m.ctrip.com/webapp/travel-destination/videoGuide/share?locale=zh-CN&curr=CNY&isThemeMode=true&themeId=85&videoType=2&videoId=3445&themeSign=AAEAAQAHdGhlbWVpZOl7JGnNiU3oJyZ__UZf96irsWvecU2ukQGz0F8sTUGz-tripsign&s_guid=5df76f4e-8c36-4fbb-a2bb-82616dee1ca9&csharecid=32001157790441421576';
root.querySelector('.aio-btn').addEventListener('click',()=>window.location.assign(aioDestinationUrl));
const videoPalettes={spa:[['#b65d42','#402b28'],['#547b88','#203844'],['#d09a4e','#58341f']],flower:[['#df86a4','#6f314b'],['#8eac7d','#35543d'],['#e0ad64','#844b2f']],heritage:[['#c7694d','#5e2923'],['#557d91','#243a48'],['#c2974b','#5c3a20']]};
function applyVideoPalette(index){const shift=index%3;const selectedName=places[index-1].name;const pool=spotlights[theme].map(d=>photoManifest[d[0]]).filter(Boolean);const start=Math.max(0,pool.indexOf(photoManifest[selectedName]));const images=[photoManifest[selectedName],pool[(start+1)%pool.length],pool[(start+2)%pool.length]];root.querySelectorAll('.video-card').forEach((el,i)=>{const pair=videoPalettes[theme][(i+shift)%3];el.style.backgroundColor=pair[0];el.style.backgroundImage=`linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.62)),url("${images[i]||images[0]}")`;el.style.backgroundSize='cover';el.style.backgroundPosition='center'})}
function setText(role,value){const el=root.querySelector(`[data-role="${role}"]`);if(el)el.textContent=value}
function render(){if(!spotlights[theme].some(d=>d[0]===places[selected].name))selected=places.findIndex(p=>p.name===spotlights[theme][0][0]);const t=themes[theme],p=places[selected];page.dataset.theme=theme;root.querySelectorAll('.theme-tab').forEach(b=>b.classList.toggle('is-active',b.dataset.theme===theme));marks.classed('is-selected',d=>d.index===p.index);marks.select('.symbol').text(t.symbol);renderCallouts();setText('lang',locale==='zh'?'中':locale==='en'?'EN':'日');setText('eyebrow',t.eyebrow);root.querySelector('[data-role="title"]').innerHTML=t.title;setText('subtitle',t.subtitle);setText('region',`${p.region} · ${p.name}`);setText('place',t.place(p));const selectedFeature=spotlights[theme].find(d=>d[0]===p.name);setText('tag',selectedFeature?.[4]||t.tag(p));setText('description',t.description);const videos=t.videos(p);setText('video1',videos[0]);setText('video2',videos[1]);setText('video3',videos[2]);const feature=selectedFeature;const sceneIcons=theme==='spa'?[feature?.[3]||'♨️','🗺️','🍲']:theme==='flower'?[feature?.[3]||'🌸','📷','🚶']:[feature?.[3]||'🪭','🧵','👤'];setText('scene1',sceneIcons[0]);setText('scene2',sceneIcons[1]);setText('scene3',sceneIcons[2]);applyVideoPalette(p.index);setText('cta',`查看${p.name}视频合集`);['decor1','decor2','decor3','float1','float2','float3'].forEach((r,i)=>setText(r,t.decor[i%3]));setText('toast','');save()}
function save(){window.openai?.setWidgetState?.({modelContent:{selectedDestination:places[selected].name,theme,locale},privateContent:{drag}}).catch(()=>{})}
render(); if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
</body></html>
